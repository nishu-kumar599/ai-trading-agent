services:
  - type: web
    name: ai-trading-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_URL
        value: https://ai-trading-agent-819y.onrender.com
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: 10
